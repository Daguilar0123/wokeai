<!-- @dsCard group="Site" height=120 subtitle="Primary / quiet / link" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&display=swap">
<style>
  body { margin: 0; background: var(--surface); color: var(--ink); font: 17px/1.55 var(--font-sans, "Archivo", system-ui, sans-serif); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 24px; }
  .btn { font: inherit; font-weight: 600; padding: 12px 20px; border-radius: var(--radius-md); border: 1px solid transparent; cursor: pointer; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: var(--accent-ink); }
  .quiet { background: var(--card); color: var(--ink); border-color: var(--rule); }
  a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
</style>
<div class="row">
  <button class="btn primary" type="button">Join</button>
  <button class="btn quiet" type="button">Add a tool</button>
  <span>Read the <a href="#">starter list</a>.</span>
</div>
