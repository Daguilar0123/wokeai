<!-- @dsCard group="Site" height=300 subtitle="Tool card / pillar cards" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap">
<style>
  body { margin: 0; background: var(--surface); color: var(--ink); font: 17px/1.55 var(--font-sans, "Archivo", system-ui, sans-serif); }
  .wrap { padding: 24px; display: grid; gap: 24px; max-width: 680px; }
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius-md); padding: 12px 16px; }
  .card a { color: var(--accent); font-weight: 600; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
  .card span { display: block; color: var(--muted); font-size: 15px; line-height: 1.45; margin-top: 2px; }
  .pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .pillar { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius-md); padding: 14px; }
  .pillar b { display: block; margin-bottom: 4px; }
  .pillar span { color: var(--muted); font-size: 15px; line-height: 1.45; }
</style>
<div class="wrap">
  <div class="card"><a href="https://ollama.com">Ollama</a><span>Run open language models on your own computer.</span></div>
  <div class="pillars">
    <div class="pillar"><b>Open source</b><span>Tools held in common, with the code where everyone can read it.</span></div>
    <div class="pillar"><b>Liberation</b><span>Starting from the people with the least power, not the most.</span></div>
    <div class="pillar"><b>Community</b><span>Nobody does this alone. The roots are the point.</span></div>
  </div>
</div>
