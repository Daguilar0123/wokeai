<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="wokeai mark: grass above a ground line; below it, a main root runs straight down with two clean branches, each ending in a node">
  <!--
    wokeai mark A — grass roots as a clean git graph (v4, 2026-10-18).
    One color (#141414). Safe area r=200 from (256,256).

    Danny on v3: "very jumbled." Spec for v4, in his words: branches like the
    Git logo; the main branch runs straight down (bearing 180) and is about
    35% longer than the first branch; the first branch leaves the top node
    down-right like the Git logo; a second branch leaves the 60% mark of the
    main branch toward bearing 210–240 (here 225), same length as the first;
    every branch ends in a node; no merge — too much for a small mark.

    Geometry: L = 112 (branch length). Top node N0 at (256,208).
    Main: N0 → (256,359), length 151 = 1.35 L.
    Branch 1: N0 → (335,287), bearing 135, length L.
    Branch 2: from (256,299) (60% of main) → (177,378), bearing 225, length L.

    Grass roots (Malcolm X, "Message to the Grass Roots", Detroit, 10 Nov 1963) /
    symbiosis (Aguilar 2014, 2025) / open-source forking as the commons.
  -->
  <g fill="none" stroke="#141414" stroke-linecap="round" stroke-linejoin="round" stroke-width="26">
    <!-- ground line -->
    <path d="M100 172 H412"/>
    <!-- grass: three blades -->
    <path d="M226 172 L214 130"/>
    <path d="M256 172 V122"/>
    <path d="M286 172 L298 130"/>
    <!-- main branch, from the surface straight down -->
    <path d="M256 172 V359"/>
    <!-- branch 1, down-right from the top node -->
    <path d="M256 208 L335 287"/>
    <!-- branch 2, down-left from the 60% mark -->
    <path d="M256 299 L177 378"/>
  </g>
  <g fill="#141414">
    <circle cx="256" cy="208" r="26"/>
    <circle cx="335" cy="287" r="26"/>
    <circle cx="256" cy="359" r="26"/>
    <circle cx="177" cy="378" r="26"/>
  </g>
</svg>
