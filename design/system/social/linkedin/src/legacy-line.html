<!doctype html>
<!--
  Swap the pronunciation line in the legacy intro card (marks/og.png, the first frame of
  marks/wokeai-brand-intro.gif) without touching anything else (October 21, 2026).
  The card came from Claude Design as pixels, not source, so the old line's size and position
  are recovered by fitting: the old text is drawn in Archivo 400 at candidate sizes and subpixel
  offsets until it matches the card's pixels, and the new text is drawn with the fitted values.
  window.__result resolves with the fit, the re-drawn old line (to prove the fit) and the new line,
  as PNG data URLs of the same box; legacy.py composites them. Run by render.mjs legacy-line.
-->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&display=block">
</head><body>
<script>
window.__result = (async () => {
  const q = new URLSearchParams(location.search);
  const src = q.get('src'), [bx0, by0, bx1, by1] = q.get('box').split(',').map(Number);
  const OLD = q.get('old'), NEW = q.get('new');
  const tokens = await (await fetch('/design/system/tokens.json')).json();
  const tok = (n) => tokens.color.tokens.find((t) => t.name === n).value.light;
  const INK = tok('muted'), BG = tok('surface');
  await document.fonts.load('400 100px Archivo', OLD + NEW);
  await document.fonts.ready;
  const m = document.createElement('canvas').getContext('2d');
  for (const ch of new Set([...NEW])) {
    m.font = '400 100px Archivo, serif'; const a = m.measureText(ch).width;
    m.font = '400 100px Archivo, monospace'; const b = m.measureText(ch).width;
    if (Math.abs(a - b) > 0.01) throw new Error(`glyph ${ch} is not in Archivo`);
  }
  const img = new Image(); img.src = src; await img.decode();
  const W = bx1 - bx0, H = by1 - by0;
  const c0 = new OffscreenCanvas(W, H), x0 = c0.getContext('2d', { willReadFrequently: true });
  x0.drawImage(img, -bx0, -by0);
  const orig = x0.getImageData(0, 0, W, H).data;
  // the old line's ink box inside the card (measured from the pixels)
  const bgRGB = [1, 3, 5].map((i) => parseInt(BG.slice(i, i + 2), 16));
  let L = W, R = -1, T = H, B = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4;
    if (orig[i] !== bgRGB[0] || orig[i + 1] !== bgRGB[1] || orig[i + 2] !== bgRGB[2]) { L = Math.min(L, x); R = Math.max(R, x); T = Math.min(T, y); B = Math.max(B, y); }
  }
  const c = new OffscreenCanvas(W, H), cx = c.getContext('2d', { willReadFrequently: true });
  const draw = (text, s, x, y) => {
    cx.fillStyle = BG; cx.fillRect(0, 0, W, H);
    cx.font = `400 ${s}px Archivo`; cx.fillStyle = INK; cx.textBaseline = 'alphabetic';
    cx.fillText(text, x, y);
    return cx.getImageData(0, 0, W, H).data;
  };
  const score = (d) => { let s = 0; for (let i = 0; i < d.length; i += 4) s += Math.abs(d[i] - orig[i]) + Math.abs(d[i + 1] - orig[i + 1]) + Math.abs(d[i + 2] - orig[i + 2]); return s; };
  cx.font = '400 100px Archivo'; const mm = cx.measureText(OLD);
  const s0 = 100 * (R - L + 1) / (mm.actualBoundingBoxLeft + mm.actualBoundingBoxRight);
  let best = { sc: Infinity };
  const tryAt = (s, x, y) => { const sc = score(draw(OLD, s, x, y)); if (sc < best.sc) best = { sc, s, x, y }; };
  const est = (s) => { cx.font = `400 ${s}px Archivo`; const t = cx.measureText(OLD); return [L + t.actualBoundingBoxLeft, T + t.actualBoundingBoxAscent]; };
  for (let s = s0 - 0.6; s <= s0 + 0.6; s += 0.05) {
    const [ex, ey] = est(s);
    for (let dx = -1.5; dx <= 1.5; dx += 0.25) for (let dy = -1.5; dy <= 1.5; dy += 0.25) tryAt(s, ex + dx, ey + dy);
  }
  const coarse = { ...best };
  for (let s = coarse.s - 0.05; s <= coarse.s + 0.05; s += 0.01)
    for (let dx = -0.25; dx <= 0.25; dx += 0.0625) for (let dy = -0.25; dy <= 0.25; dy += 0.0625) tryAt(s, coarse.x + dx, coarse.y + dy);
  // quality of the fit: the re-drawn old line against the card
  const re = draw(OLD, best.s, best.x, best.y);
  let maxd = 0, exact = 0, n = 0;
  for (let i = 0; i < re.length; i += 4) {
    const d = Math.max(Math.abs(re[i] - orig[i]), Math.abs(re[i + 1] - orig[i + 1]), Math.abs(re[i + 2] - orig[i + 2]));
    maxd = Math.max(maxd, d); exact += d === 0; n++;
  }
  const toURL = async (data) => { const k = new OffscreenCanvas(W, H); k.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(data), W, H), 0, 0);
    const blob = await k.convertToBlob({ type: 'image/png' }); return await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); }); };
  const oldURL = await toURL(re);
  const neu = draw(NEW, best.s, best.x, best.y);
  const newURL = await toURL(neu);
  cx.font = `400 ${best.s}px Archivo`; const nm = cx.measureText(NEW);
  return { box: [bx0, by0, bx1, by1], inkBox: [L + bx0, T + by0, R + bx0, B + by0], color: INK, background: BG,
           size: +best.s.toFixed(3), x: +(best.x + bx0).toFixed(4), baseline: +(best.y + by0).toFixed(4),
           fit: { maxDiff: maxd, exactPixels: +(exact / n).toFixed(4), meanDiff: +(best.sc / (n * 3)).toFixed(3) },
           newInkWidth: +(nm.actualBoundingBoxLeft + nm.actualBoundingBoxRight).toFixed(1), oldURL, newURL };
})();
</script>
</body></html>
